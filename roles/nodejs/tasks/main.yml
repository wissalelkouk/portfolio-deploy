---
- name: Supprimer d'anciennes sources NodeSource (script setup_XX.x)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /etc/apt/sources.list.d/nodesource.sources
    - /usr/share/keyrings/nodesource.gpg

- name: Créer le dossier des clés apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Récupérer la clé GPG NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Ajouter le dépôt NodeSource
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
    filename: nodejs-nodesource
    state: present
    update_cache: true

- name: Installer Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Installer PM2 (global)
  community.general.npm:
    name: pm2
    global: true
    state: present
