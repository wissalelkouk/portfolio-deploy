---
- name: Créer le dossier de l'application
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Cloner / mettre à jour le dépôt
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
  become_user: "{{ app_user }}"
  register: app_git

- name: Vérifier la présence d'un build existant
  ansible.builtin.stat:
    path: "{{ app_dir }}/.next/BUILD_ID"
  register: app_build

- name: Installer les dépendances (npm ci)
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_git.changed or not app_build.stat.exists

- name: Construire l'application (npm run build)
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_git.changed or not app_build.stat.exists
  notify: Redémarrer l'application

- name: Vérifier si l'application est déjà enregistrée dans PM2
  ansible.builtin.command: pm2 describe {{ pm2_app_name }}
  become_user: "{{ app_user }}"
  register: pm2_status
  changed_when: false
  failed_when: false

- name: Démarrer l'application avec PM2
  ansible.builtin.command: pm2 start npm --name {{ pm2_app_name }} -- start
  args:
    chdir: "{{ app_dir }}"
  environment:
    PORT: "{{ app_port }}"
  become_user: "{{ app_user }}"
  when: pm2_status.rc != 0
  register: pm2_started

- name: Sauvegarder la liste des processus PM2
  ansible.builtin.command: pm2 save
  become_user: "{{ app_user }}"
  when: pm2_started is changed

- name: Activer PM2 au démarrage du serveur (systemd)
  ansible.builtin.command: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  args:
    creates: "/etc/systemd/system/pm2-{{ app_user }}.service"
